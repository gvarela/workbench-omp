<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup: Workspace settings panel v001</title>
  <link rel="stylesheet" href="../../../../../styles/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">Ledgerboard</div>
    <nav class="app-nav">
      <a class="app-nav__link app-nav__link--active" href="#">Dashboard</a>
      <a class="app-nav__link" href="#">Settings</a>
    </nav>
  </header>

  <main class="app-main">
    <h1 class="page-title">Workspace settings</h1>

    <form class="card">
      <div class="card__header">Workspace</div>
      <div class="card__body">
        <div class="form-field">
          <label class="form-field__label" for="workspace-name">Workspace name</label>
          <input class="form-field__input" id="workspace-name" type="text" value="Acme Billing">
        </div>
        <div class="form-field">
          <label class="form-field__label" for="notification-email">Notification email</label>
          <input class="form-field__input" id="notification-email" type="email" value="billing@acme.example">
          <span class="form-field__hint">Receives payment alerts and the weekly digest.</span>
        </div>
        <div class="form-field">
          <label class="form-field__label" for="weekly-digest">Weekly digest</label>
          <input class="form-field__input" id="weekly-digest" type="checkbox" checked>
        </div>
        <div class="notice notice--error" hidden>Could not save workspace settings. Try again.</div>
      </div>
      <div class="card__footer">
        <button class="btn btn--secondary" type="button">Cancel</button>
        <button class="btn btn--primary" type="submit">Save</button>
      </div>
    </form>
  </main>
</body>
</html>
