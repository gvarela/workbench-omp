# Copy these values into the applicable OMP config.yml.
# Profile: Anthropic Max (high quota) + OpenAI Plus via openai-codex (low quota).
# Anthropic carries volume: coordinator, workers, research, compaction.
# OpenAI carries the low-volume, high-value calls: independent verification and
# review, one call per task, always on the other family from the worker.
# Revise the concrete models when either provider ships a new tier; the role
# names and the volume/verification split are the stable part.
enabledProviders:
  - claude-plugins

modelRoleStorage: project

modelRoles:
  # Main session, coordinator, planning skills.
  default: "anthropic/claude-sonnet-5"
  # Read-only research agents (locator, pattern-finder) and mechanical workers.
  smol: "anthropic/claude-haiku-4-5:high"
  # Standard tier for workers, analyzers, and product research.
  task: "anthropic/claude-sonnet-5:medium"
  # Architectural or cross-cutting work and the single escalation fix worker.
  slow: "anthropic/claude-fable-5-1:high"
  # Cross-family slot at maximum effort, used by two agents: wb-task-verifier
  # (hard pass/fail gate, one call per task) and wb-oracle (deep second
  # opinion on demand: "ask the oracle" / "@oracle").
  review: "openai-codex/gpt-5.6-sol:xhigh"
  # Push variant of the oracle: a passive second model that reviews every
  # main-thread turn and injects notes. Same cross-family model as review.
  # Assigning the role here costs nothing; the advisor runs only while enabled.
  # Workbench cannot toggle it per skill (watch-list P12), so the user turns it
  # on with `/advisor on` before /wb:explore_design or /wb:create_tasks and
  # `/advisor off` before implementation, where the verifier already gates.
  advisor: "openai-codex/gpt-5.6-sol:high"

retry:
  # Coding-plan quota is reported by both subscriptions; prefer the primary
  # until it is inside the reserve, then take the configured fallback.
  usageAwareFallback: true
  usageReservePct: 15
  # Background agents fall back without prompting; interactive turns confirm.
  usageReservePolicy: confirm
  # Do not sleep through 5-hour windows; fall back instead.
  waitForUsageReset: false
  fallbackChains:
    # Plus quota is the scarce resource. When it is exhausted the review role
    # stays independent by moving to the strongest Anthropic model rather than
    # the worker's own tier. A same-provider alternative (gpt-6-astra) would
    # share the exhausted quota, so it does not belong in this chain; swap it
    # into `review` itself for open-ended architectural verification.
    review:
      - "anthropic/claude-fable-5-1:xhigh"
    # If Max quota runs down, volume roles step down inside Anthropic first
    # and only then cross to OpenAI, so Plus is spent last.
    slow:
      - "anthropic/claude-sonnet-5:high"
      - "openai-codex/gpt-5.6-sol:high"
    task:
      - "anthropic/claude-haiku-4-5:high"
      - "openai-codex/gpt-5.6-sol:medium"
    default:
      - "anthropic/claude-haiku-4-5:high"
      - "openai-codex/gpt-5.6-sol:medium"

task:
  softRequestBudget: 200
  maxConcurrency: 8
  enableEffort: false
  enableLsp: true

# Leave `advisor.enabled` unset (off) and use `/advisor on|off` per session.
# Set it true only for a project whose sessions are planning-only; it spends a
# review-tier call on every primary turn, including worker coordination.
advisor:
  immuneTurns: 3
